<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#3b82f6">
  <meta name="description" content="SuperEyes - 搜尋公司或個人的背景資料">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.svg">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
  <title>SuperEyes 超級之眼</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <span class="logo-icon">👁️</span>
        <h1>SuperEyes</h1>
      </div>
      <p class="subtitle">輸入公司或個人名稱，搜尋背後的所有公開資料</p>
    </header>

    <!-- Search Section -->
    <main class="main">
      <div class="search-container">
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input
            type="text"
            id="searchInput"
            placeholder="輸入公司名稱或個人姓名..."
            autocomplete="off"
          >
          <button id="searchBtn" class="search-btn">搜尋</button>
        </div>
        <div class="search-type-toggle">
          <button class="type-btn active" data-type="all">全部</button>
          <button class="type-btn" data-type="company">公司</button>
          <button class="type-btn" data-type="person">個人</button>
        </div>
      </div>

      <!-- Loading -->
      <div id="loading" class="loading hidden">
        <div class="spinner"></div>
        <p>搜尋中...</p>
      </div>

      <!-- Results -->
      <div id="results" class="results hidden">
        <h2 class="results-title">
          搜尋結果：<span id="resultQuery"></span>
        </h2>

        <div class="results-grid">
          <!-- 公司登記 -->
          <section class="result-card" id="card-company">
            <div class="card-header">
              <span class="card-icon">🏢</span>
              <h3>公司登記資料</h3>
            </div>
            <div class="card-body" id="result-company"></div>
          </section>

          <!-- 法院判決 -->
          <section class="result-card" id="card-court">
            <div class="card-header">
              <span class="card-icon">⚖️</span>
              <h3>法院判決</h3>
            </div>
            <div class="card-body" id="result-court"></div>
          </section>

          <!-- 新聞 -->
          <section class="result-card" id="card-news">
            <div class="card-header">
              <span class="card-icon">📰</span>
              <h3>相關新聞</h3>
            </div>
            <div class="card-body" id="result-news"></div>
          </section>

          <!-- 公開資料 -->
          <section class="result-card" id="card-public">
            <div class="card-header">
              <span class="card-icon">📋</span>
              <h3>公開資料</h3>
            </div>
            <div class="card-body" id="result-public"></div>
          </section>

          <!-- Facebook -->
          <section class="result-card" id="card-fb">
            <div class="card-header">
              <span class="card-icon">📘</span>
              <h3>Facebook</h3>
            </div>
            <div class="card-body" id="result-fb"></div>
          </section>

          <!-- Instagram -->
          <section class="result-card" id="card-ig">
            <div class="card-header">
              <span class="card-icon">📷</span>
              <h3>Instagram</h3>
            </div>
            <div class="card-body" id="result-ig"></div>
          </section>
        </div>
      </div>

      <!-- Empty State -->
      <div id="emptyState" class="empty-state">
        <div class="empty-icon">🔍</div>
        <p>開始搜尋以查看結果</p>
        <div class="suggestions">
          <p class="suggestions-title">試試搜尋：</p>
          <div class="suggestion-tags">
            <button class="suggestion-tag" data-query="台積電">台積電</button>
            <button class="suggestion-tag" data-query="鴻海精密">鴻海精密</button>
            <button class="suggestion-tag" data-query="統一企業">統一企業</button>
          </div>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <p>SuperEyes &copy; 2026 | 所有資料來自公開來源</p>
    </footer>
  </div>

  <script src="js/search.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
